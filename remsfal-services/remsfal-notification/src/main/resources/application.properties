%dev.quarkus.devservices.enabled=false
# Server port
quarkus.http.port=8082
# Server host
quarkus.http.host=0.0.0.0

# MicroProfile / SmallRye JWT configuration
quarkus.smallrye-jwt.enabled=true
mp.jwt.verify.issuer=REMSFAL
%dev.mp.jwt.verify.publickey.location=http://localhost:8080/api/v1/authentication/jwks
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=remsfal_access_token

# Database configuration
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=remsfalAdmin
%dev.quarkus.datasource.password=remsfalSecret
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/remsfal_notification
%dev.quarkus.datasource.devservices.enabled=false
# Connection pooling
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10
# Connection properties
quarkus.datasource.jdbc.additional-jdbc-properties.ApplicationName=remsfal-notification
# ORM packages
quarkus.hibernate-orm.packages=de.remsfal.notification.entity.dto,de.remsfal.common.entity
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.second-level-caching-enabled=false
%dev.quarkus.hibernate-orm.log.sql=true
# Liquibase config
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=META-INF/liquibase-changelog.xml

# openapi config
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.smallrye-openapi.store-schema-file-name=notification-spec

%dev.quarkus.http.proxy.enable-forwarded-host=true
%test.quarkus.http.proxy.enable-forwarded-host=true

# S3 file storage (shared bucket for platform and notification, see AGENT.md#file-storage)
remsfal.storage.bucket-name=remsfal
# The notification service only reads from the bucket: in production use read-only credentials
# and disable the bucket creation on startup via REMSFAL_STORAGE_CREATE_BUCKET=false
quarkus.s3.devservices.enabled=false
%test.quarkus.s3.devservices.enabled=true
%dev.quarkus.s3.endpoint-override=http://localhost:9000
%dev.quarkus.s3.aws.region=us-east-1
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=remsfalAdmin
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=remsfalSecret
%dev.quarkus.s3.path-style-access=true

# SmallRye JWT Debug-Logging
%dev.quarkus.log.category."io.smallrye.jwt".level=DEBUG
%dev.quarkus.log.category."io.quarkus.smallrye.jwt".level=DEBUG

# Kafka configuration
%dev.quarkus.kafka.devservices.enabled=false
%test.quarkus.kafka.devservices.enabled=true
%dev.mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:39092
# Kafka configuration for notification events
mp.messaging.incoming.user-notifications.connector=smallrye-kafka
mp.messaging.incoming.user-notifications.topic=user-notifications
mp.messaging.incoming.user-notifications.group.id=notification-service
mp.messaging.incoming.user-notifications.commit-strategy=throttled
mp.messaging.incoming.user-notifications.auto.offset.reset=earliest
# Kafka configuration for user events
mp.messaging.incoming.user-events.connector=smallrye-kafka
mp.messaging.incoming.user-events.topic=user-events
mp.messaging.incoming.user-events.group.id=notification-user-events-consumer
mp.messaging.incoming.user-events.commit-strategy=throttled
mp.messaging.incoming.user-events.auto.offset.reset=earliest
# Kafka configuration for issue events
mp.messaging.incoming.issue-events-enriched.connector=smallrye-kafka
mp.messaging.incoming.issue-events-enriched.topic=issue-events-enriched
mp.messaging.incoming.issue-events-enriched.group.id=notification-issue-events-consumer
mp.messaging.incoming.issue-events-enriched.commit-strategy=throttled
mp.messaging.incoming.issue-events-enriched.auto.offset.reset=earliest

# FCM configuration
fcm.service-account-path=${FCM_SERVICE_ACCOUNT_PATH:}
test.fcm.service-account-path=''

# OpenTelemetry Configuration
quarkus.otel.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.service.name=remsfal-notification

# Endpoint Configuration
%dev.quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
%dev.quarkus.otel.exporter.otlp.metrics.endpoint=http://localhost:4317
quarkus.otel.traces.sampler=always_on

# test mailer config
%test.quarkus.mailer.from=test@example.com
%test.quarkus.mailer.mock=true

# Mailer config for dev: all emails are caught by Mailpit (see docker-compose.yml, UI at http://localhost:8025)
# To send real emails in dev mode, override these values with _DEV_QUARKUS_MAILER_* in a .env file (see README.md)
%dev.quarkus.mailer.from=no-reply@remsfal.dev
%dev.quarkus.mailer.mock=false
%dev.quarkus.mailer.host=localhost
%dev.quarkus.mailer.port=2525
%dev.quarkus.mailer.tls=false
