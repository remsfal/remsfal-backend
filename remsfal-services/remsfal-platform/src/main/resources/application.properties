# Server port
quarkus.http.port=8080
# Server host
quarkus.http.host=0.0.0.0
%dev.quarkus.http.proxy.enable-forwarded-host=true
%test.quarkus.http.proxy.enable-forwarded-host=true

%dev.quarkus.devservices.enabled=false

# Database configuration
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.username=remsfalAdmin
%dev.quarkus.datasource.password=remsfalSecret
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/remsfal_platform
%dev.quarkus.datasource.devservices.enabled=false
# Connection pooling
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=50
# Connection properties
quarkus.datasource.jdbc.additional-jdbc-properties.ApplicationName=remsfal-platform
# ORM packages
quarkus.hibernate-orm.packages=de.remsfal.service.entity.dto,de.remsfal.common.entity
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.second-level-caching-enabled=false
%dev.quarkus.hibernate-orm.log.sql=true
# Liquibase config
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=META-INF/liquibase-changelog.xml

# openapi config
quarkus.smallrye-openapi.store-schema-directory=target/openapi
quarkus.smallrye-openapi.store-schema-file-name=platform-spec
mp.openapi.servers=${OPENAPI_SERVERS:/} # default to same origin; override per environment

# REMSFAL Google OAUTH configuration
# The client secret and id must never be committed; provide it via the GOOGLE_CLIENT_* environment variables.
de.remsfal.auth.oidc.client-id=${GOOGLE_CLIENT_ID:not-set}
de.remsfal.auth.oidc.client-secret=${GOOGLE_CLIENT_SECRET:not-set}

# REMSFAL Sign in with Apple configuration
# Team ID, key ID and the private key (.p8) come from the Apple developer account. The private key must never be
# committed; provide it at runtime via APPLE_PRIVATE_KEY_LOCATION (e.g. file:/run/secrets/remsfal_apple_private_key).
de.remsfal.auth.apple.team-id=${APPLE_TEAM_ID:not-set}
de.remsfal.auth.apple.key-id=${APPLE_KEY_ID:not-set}
de.remsfal.auth.apple.private-key-location=${APPLE_PRIVATE_KEY_LOCATION:not-set}
# Services ID (client ID and audience of the web flow) and bundle ID (client ID and audience of the iOS app)
de.remsfal.auth.apple.services-id=${APPLE_SERVICES_ID:not-set}
de.remsfal.auth.apple.bundle-id=${APPLE_BUNDLE_ID:not-set}
de.remsfal.auth.apple.auth-server-url=https://appleid.apple.com
de.remsfal.auth.apple.scopes=name email
# Lifetime of the generated client secret (at most 6 months)
de.remsfal.auth.apple.client-secret.timeout=P30D
%test.de.remsfal.auth.apple.team-id=TESTTEAMID
%test.de.remsfal.auth.apple.key-id=TESTKEYID
%test.de.remsfal.auth.apple.private-key-location=classpath:test-keys/apple-test-key.p8
%test.de.remsfal.auth.apple.services-id=de.remsfal.test.web
%test.de.remsfal.auth.apple.bundle-id=de.remsfal.test.app

# REMSFAL passwordless email login (one-time code sent by email)
de.remsfal.auth.email-login.code-ttl=PT15M
de.remsfal.auth.email-login.max-attempts=5
# Rate limits within the window: code requests per email address and per client, code attempts per client
de.remsfal.auth.email-login.rate-limit.window=PT15M
de.remsfal.auth.email-login.rate-limit.per-email=5
de.remsfal.auth.email-login.rate-limit.per-ip=20
de.remsfal.auth.email-login.rate-limit.verify-per-ip=30
# Logged login attempts (IP address, timestamp, result) are deleted after the retention period
de.remsfal.auth.email-login.attempt-retention=P30D
de.remsfal.auth.email-login.cleanup-interval=1h

# REMSFAL dev login & seed data (build-time switches, never enable them for production builds)
%dev.de.remsfal.auth.dev-login.enabled=true
%dev.de.remsfal.dev.seed.enabled=true

# REMSFAL Frontend URL configuration
de.remsfal.frontend.url.base=https://remsfal.de
%test.de.remsfal.frontend.url.base=https://remsfal.de
%dev.de.remsfal.frontend.url.base=http://localhost:5173

# JWT authorization configuration
# The platform signs the tokens. The private key is never part of the build: in production it is provided at runtime
# via DE_REMSFAL_AUTH_JWT_PRIVATE_KEY_LOCATION (e.g. file:/run/secrets/remsfal_jwt_private_key), in dev mode it is
# generated into .dev-keys/ on first start (see README.md#jwt-token).
de.remsfal.auth.jwt.signing.enabled=true
%test.de.remsfal.auth.jwt.private-key-location=classpath:test-keys/privateKey.pem
de.remsfal.auth.jwt.key-id=remsfal-platform-key
de.remsfal.auth.jwt.issuer=REMSFAL
# MicroProfile / SmallRye JWT configuration
# Like all other services, the platform verifies tokens with the public key from its own JWKS endpoint
mp.jwt.verify.publickey.location=http://localhost:${quarkus.http.port}/api/v1/authentication/jwks
%test.mp.jwt.verify.publickey.location=test-keys/publicKey.pem
%test.smallrye.jwt.sign.key.location=test-keys/privateKey.pem
mp.jwt.verify.issuer=REMSFAL
mp.jwt.token.header=Cookie
mp.jwt.token.cookie=remsfal_access_token

# S3 file storage (shared bucket for platform and notification, see AGENT.md#file-storage)
remsfal.storage.bucket-name=remsfal
quarkus.s3.devservices.enabled=false
%test.quarkus.s3.devservices.enabled=true
%dev.quarkus.s3.endpoint-override=http://localhost:9000
%dev.quarkus.s3.aws.region=us-east-1
%dev.quarkus.s3.aws.credentials.type=static
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=remsfalAdmin
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=remsfalSecret
%dev.quarkus.s3.path-style-access=true

# Kafka configuration
%dev.quarkus.kafka.devservices.enabled=false
%test.quarkus.kafka.devservices.enabled=true
%dev.mp.messaging.connector.smallrye-kafka.bootstrap.servers=localhost:39092
mp.messaging.outgoing.user-notifications.connector=smallrye-kafka
mp.messaging.outgoing.user-notifications.topic=user-notifications
mp.messaging.outgoing.user-events.connector=smallrye-kafka
mp.messaging.outgoing.user-events.topic=user-events
mp.messaging.outgoing.organization-events.connector=smallrye-kafka
mp.messaging.outgoing.organization-events.topic=organization-events
mp.messaging.outgoing.project-events.connector=smallrye-kafka
mp.messaging.outgoing.project-events.topic=project-events
mp.messaging.incoming.issue-events-basic.connector=smallrye-kafka
mp.messaging.incoming.issue-events-basic.topic=issue-events-basic
mp.messaging.incoming.issue-events-basic.group.id=platform-service
mp.messaging.incoming.issue-events-basic.auto.offset.reset=earliest
mp.messaging.outgoing.issue-events-enriched.connector=smallrye-kafka
mp.messaging.outgoing.issue-events-enriched.topic=issue-events-enriched

# Disable observability dev services during tests
%test.quarkus.observability.enabled=false
%test.quarkus.observability.devservices.enabled=false

# Logging / OpenTelemetry

# HTTP Access Log for User and Project Endpoints
quarkus.http.access-log.enabled=true
quarkus.http.access-log.category=access_log

# OpenTelemetry Configuration
quarkus.otel.enabled=true
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.service.name=remsfal-platform

# Endpoint Configuration
%dev.quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
%dev.quarkus.otel.exporter.otlp.metrics.endpoint=http://localhost:4317

quarkus.otel.resource.attributes=service.version=1.0.0,environment=dev

# Filter for User and Project Endpoints
quarkus.otel.traces.sampler=always_on
quarkus.otel.traces.suppress-non-application-uris=true
