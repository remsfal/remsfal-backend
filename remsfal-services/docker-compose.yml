include:
  - remsfal-ticketing/docker-compose.yml
  - remsfal-notification/docker-compose.yml
services:
  postgres:
    image: postgres:18.7
    container_name: postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=remsfalAdmin
      - POSTGRES_PASSWORD=remsfalSecret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U remsfalAdmin"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - remsfal

  # S3 compatible file storage shared by all services (platform, notification, ticketing, ocr)
  localstack:
    image: localstack/localstack:4.14.0
    container_name: localstack
    restart: unless-stopped
    environment:
      - SERVICES=s3
      - PERSISTENCE=1
    ports:
      - "9000:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    networks:
      - remsfal

  kafka-broker:
    image: apache/kafka:4.4.0
    hostname: kafka-broker
    container_name: kafka-broker
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "39092:39092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,HOST://0.0.0.0:39092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-broker:29092,EXTERNAL://kafka-broker:9092,HOST://localhost:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    # Unused paths declared as VOLUME by the image; tmpfs avoids anonymous volumes
    tmpfs:
      - /etc/kafka/secrets
      - /mnt/shared/config
    healthcheck:
      test: ["CMD", "bash", "-c", "nc -z localhost 29092"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - remsfal

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka-broker
    ports:
      - "8020:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: kafka-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-broker:9092
    networks:
      - remsfal

  otel-lgtm:
    image: grafana/otel-lgtm:0.40.0
    container_name: otel-lgtm
    restart: unless-stopped
    ports:
      - '3000:3000' # Grafana Frontend
      - '4317:4317' # gRPC as the transport for OTLP
      - '4318:4318' # HTTP as the transport for OTLP
    volumes:
      - otel_data:/data
    networks:
      - remsfal

volumes:
  postgres_data:
  kafka_data:
  otel_data:
  localstack_data:

networks:
  remsfal:
    driver: bridge
