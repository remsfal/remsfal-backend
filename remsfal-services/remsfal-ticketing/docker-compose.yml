services:
  localstack:
    image: localstack/localstack:4.9
    container_name: localstack
    restart: unless-stopped
    depends_on:
      cassandra:
        condition: service_healthy
    environment:
      - SERVICES=s3
      - PERSISTENCE=1
    ports:
      - "9000:4566"
    volumes:
      - localstack_data:/var/lib/localstack
    networks:
      - remsfal

  cassandra:
    image: cassandra:5
    container_name: cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=remsfal-cassandra-cluster
      - CASSANDRA_NUM_TOKENS=8
      - CASSANDRA_SEEDS=cassandra
      - CASSANDRA_USER=remsfalAdmin
      - CASSANDRA_PASSWORD=remsfalSecret
      - MAX_HEAP_SIZE=1G
      - HEAP_NEWSIZE=256M
    ports:
      - "9042:9042"
    mem_limit: 3g
    memswap_limit: 4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - remsfal

  ocr:
    image: ghcr.io/remsfal/remsfal-ocr:latest
    container_name: remsfal-ocr
    restart: unless-stopped
    depends_on:
      kafka-broker:
        condition: service_healthy
      localstack:
        condition: service_started
    environment:
      - KAFKA_BROKER=kafka-broker:29092
      - S3_ENDPOINT=localstack:4566
      - PYTHONUNBUFFERED=1
    networks:
      - remsfal

volumes:
  cassandra_data:
  localstack_data:
