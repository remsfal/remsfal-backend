name: "CD Build"

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-image-and-push-to-registry:
    name: "Build and Deploy Docker Image (${{ matrix.microservice }})"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Only run in repositories of the REMSFAL organization, not in personal forks
    if: github.repository_owner == 'remsfal'
    # Repositories with their own registry set CD_ENVIRONMENT (e.g. staging), which provides
    # REGISTRY_HOST, REGISTRY_USERNAME and REGISTRY_PASSWORD. Without it, images go to ghcr.io.
    environment: ${{ vars.CD_ENVIRONMENT }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: true
      matrix:
        microservice: ["remsfal-platform", "remsfal-ticketing", "remsfal-notification"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build REMSFAL
        uses: ./.github/actions/build-remsfal
        with:
          # Tests and Checkstyle already run in the CI Build
          skip-tests: 'true'
          skip-checkstyle: 'true'
      - name: Verify ${{ matrix.microservice }} JAR exists
        run: ls -l remsfal-services/${{ matrix.microservice }}/target/${{ matrix.microservice }}-runner.jar
      - name: Verify ${{ matrix.microservice }} JAR contains no keys
        run: |
          if unzip -l remsfal-services/${{ matrix.microservice }}/target/${{ matrix.microservice }}-runner.jar \
            | grep -E '\.(pem|key)$'; then
            echo "::error::Key files must not be packaged into the image"
            exit 1
          fi
      - name: Prepare Docker build context
        # Only the runner JAR is needed, so the image is not built from the whole workspace
        run: |
          mkdir -p docker-context/remsfal-services/${{ matrix.microservice }}/target
          cp remsfal-services/${{ matrix.microservice }}/target/${{ matrix.microservice }}-runner.jar \
            docker-context/remsfal-services/${{ matrix.microservice }}/target/
      - name: Login to Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}/${{ matrix.microservice }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: docker-context
          file: ./src/main/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ matrix.microservice }}
      - name: Generate artifact attestation
        # Artifact attestations for private repositories require GitHub Enterprise Cloud
        if: ${{ !github.event.repository.private }}
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}/${{ matrix.microservice }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
