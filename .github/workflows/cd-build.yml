name: "CD Build"

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-image-and-push-to-registry:
    name: "Build and Deploy Docker Image (${{ matrix.microservice }})"
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    # Only run in repositories of the REMSFAL organization, not in personal forks
    if: github.repository_owner == 'remsfal'
    # Repositories with their own registry set CD_ENVIRONMENT (e.g. staging), which provides
    # REGISTRY_HOST, REGISTRY_USERNAME and REGISTRY_PASSWORD. Without it, images go to ghcr.io.
    environment: ${{ vars.CD_ENVIRONMENT }}
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: true
      matrix:
        microservice: ["remsfal-platform", "remsfal-ticketing", "remsfal-notification"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build REMSFAL
        uses: ./.github/actions/build-remsfal
        with:
          # Tests and Checkstyle already run in the CI Build
          skip-tests: 'true'
          skip-checkstyle: 'true'
      - name: Determine image name and version
        id: image
        # The image prefix follows the repository name, like in the frontend:
        # remsfal-backend -> remsfal-platform, online-backend -> online-platform
        env:
          REPOSITORY: ${{ github.event.repository.name }}
          MICROSERVICE: ${{ matrix.microservice }}
        run: |
          echo "name=${REPOSITORY%%-*}-${MICROSERVICE#remsfal-}" >> "$GITHUB_OUTPUT"
          echo "version=$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"
      - name: Verify ${{ matrix.microservice }} JAR exists
        run: ls -l remsfal-services/${{ matrix.microservice }}/target/${{ matrix.microservice }}-runner.jar
      - name: Verify ${{ matrix.microservice }} JAR contains no keys
        run: |
          if unzip -l remsfal-services/${{ matrix.microservice }}/target/${{ matrix.microservice }}-runner.jar \
            | grep -E '\.(pem|key)$'; then
            echo "::error::Key files must not be packaged into the image"
            exit 1
          fi
      - name: Prepare Docker build context
        # Only the runner JAR is needed, so the image is not built from the whole workspace
        run: |
          mkdir -p docker-context/remsfal-services/${{ matrix.microservice }}/target
          cp remsfal-services/${{ matrix.microservice }}/target/${{ matrix.microservice }}-runner.jar \
            docker-context/remsfal-services/${{ matrix.microservice }}/target/
      - name: Login to Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}
          username: ${{ vars.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_PASSWORD || secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.image.outputs.version }}
            type=sha
          labels: |
            org.opencontainers.image.version=${{ steps.image.outputs.version }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7.4.0
        with:
          context: docker-context
          file: ./src/main/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SERVICE_NAME=${{ matrix.microservice }}
      - name: Install cosign
        # Only repositories whose environment provides a cosign key pair (see online-terraform) sign their images
        if: ${{ vars.COSIGN_PUBLIC_KEY != '' }}
        uses: sigstore/cosign-installer@v4.1.2
        with:
          # cosign v2 writes the classic .sig signature, which Harbor shows as signed
          cosign-release: 'v2.6.5'
      - name: Sign image with cosign
        if: ${{ vars.COSIGN_PUBLIC_KEY != '' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PUBLIC_KEY: ${{ vars.COSIGN_PUBLIC_KEY }}
          IMAGE: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}/${{ steps.image.outputs.name }}@${{ steps.push.outputs.digest }}
        run: |
          KEY_DIR=$(mktemp -d)
          trap 'rm -rf "$KEY_DIR"' EXIT
          # cosign only signs with its own encrypted key format, so import the PEM key with a throwaway password
          export COSIGN_PASSWORD=$(openssl rand -hex 32)
          printf '%s\n' "$COSIGN_PRIVATE_KEY" > "$KEY_DIR/cosign.pem"
          printf '%s\n' "$COSIGN_PUBLIC_KEY" > "$KEY_DIR/cosign.pub.pem"
          cosign import-key-pair --key "$KEY_DIR/cosign.pem" --output-key-prefix "$KEY_DIR/cosign" -y
          # --tlog-upload=false keeps the signature out of the public Rekor transparency log
          cosign sign --key "$KEY_DIR/cosign.key" --tlog-upload=false -y "$IMAGE"
          cosign verify --key "$KEY_DIR/cosign.pub.pem" --insecure-ignore-tlog=true "$IMAGE" > /dev/null
          echo "Signed $IMAGE"
      - name: Generate artifact attestation
        # Artifact attestations for private repositories require GitHub Enterprise Cloud
        if: ${{ !github.event.repository.private }}
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ vars.REGISTRY_HOST || 'ghcr.io' }}/${{ github.repository_owner }}/${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
