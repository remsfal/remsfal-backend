name: "Sonar Analysis"

on:
  workflow_run:
    workflows: [CI Build]
    types: [completed]

permissions:
  contents: read
  actions: read # required for atifact download
  pull-requests: write # required to set PR status

jobs:
  sonar-cloud-analysis:
    name: "Sonar Cloud Build"
    runs-on: ubuntu-latest
    # dependabot should not have SONAR_TOKEN
    if: github.actor != 'dependabot[bot]' && github.repository == 'remsfal/remsfal-backend' && github.event.workflow_run.conclusion == 'success'

    steps:
      # Fork PR code is only checked out as data for the scanner. Maven itself must not
      # evaluate any fork-controlled build config (see "Use trusted Maven build config").
      - name: Checkout at triggering commit (read-only)
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Download Coverage Report from CI Build
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: coverage-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/artifacts/coverage
      - name: Prepare coverage directory and move jacoco.xml
        run: |
          mkdir -p target/site/jacoco
          if [ -f "${{ runner.temp }}/artifacts/coverage/jacoco.xml" ]; then
            mv "${{ runner.temp }}/artifacts/coverage/jacoco.xml" target/site/jacoco/
          else
            echo "Error: jacoco.xml not found in coverage artifact." >&2
            exit 1
          fi
      - name: Download Checkstyle Report from CI Build
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: checkstyle-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/artifacts/checkstyle
      - name: Prepare checkstyle directory and move checkstyle-result.xml
        run: |
          mkdir -p checkstyle
          if [ -f "${{ runner.temp }}/artifacts/checkstyle/checkstyle-result.xml" ]; then
            mv "${{ runner.temp }}/artifacts/checkstyle/checkstyle-result.xml" target/
          else
            echo "Error: checkstyle-result.xml not found in checkstyle artifact." >&2
            exit 1
          fi
      - name: Download Compiled Classes from CI Build
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: binaries-${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/artifacts/binaries
      - name: Move binaries in target only
        run: |
          find "${{ runner.temp }}/artifacts/binaries" -type d -name target | while read src; do
            rel=$(realpath --relative-to="${{ runner.temp }}/artifacts/binaries" "$src")
            mkdir -p "$rel"
            cp -R "$src/"* "$rel/"
          done
      # mvn sonar:sonar runs with SONAR_TOKEN, so a fork must not control plugins, extensions
      # or JVM options. Replace all POMs and Maven config with the default branch versions.
      - name: Use trusted Maven build config from the default branch
        run: |
          git fetch --no-tags --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          find . -name pom.xml -not -path "./.git/*" -delete
          rm -rf .mvn mvnw mvnw.cmd
          git checkout FETCH_HEAD -- ':(glob)**/pom.xml' .mvn mvnw mvnw.cmd

      # --- Sonar -> PULL REQUESTS ---
      # Match on head repository and branch, so that equally named fork branches
      # (e.g. "main") cannot be mapped to the wrong pull request.
      - name: Find Pull Request by Head Repository and Branch
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        id: pr_by_branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.event.workflow_run.repository.full_name }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          pr_json=$(gh api -X GET "repos/${REPO}/pulls" \
            -f state=all -f head="${HEAD_OWNER}:${HEAD_BRANCH}" -f sort=updated -f direction=desc \
            --jq "[.[] | select(.head.repo.full_name == \"${HEAD_REPO}\")][0] // empty
              | {number, headRef: .head.ref, baseRef: .base.ref}")
          echo "$pr_json"
          if [ -z "$pr_json" ]; then
            echo "::error::No pull request found for ${HEAD_REPO}:${HEAD_BRANCH}."
            exit 1
          fi
          # set outputs
          echo "number=$(echo "$pr_json" | jq -r '.number')" >> "$GITHUB_OUTPUT"
          echo "headRef=$(echo "$pr_json" | jq -r '.headRef')" >> "$GITHUB_OUTPUT"
          echo "baseRef=$(echo "$pr_json" | jq -r '.baseRef')" >> "$GITHUB_OUTPUT"
      - name: SonarCloud Scan (PR decoration)
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ steps.pr_by_branch.outputs.number }}
          PR_HEAD_REF: ${{ steps.pr_by_branch.outputs.headRef }}
          PR_BASE_REF: ${{ steps.pr_by_branch.outputs.baseRef }}
        run: |
          mvn sonar:sonar \
            -Dsonar.scm.revision="$GITHUB_HEAD_SHA" \
            -Dsonar.pullrequest.key="$PR_NUMBER" \
            -Dsonar.pullrequest.branch="$PR_HEAD_REF" \
            -Dsonar.pullrequest.base="$PR_BASE_REF"
      # --- Sonar -> PUSH on main ---
      - name: SonarCloud Scan (main branch analysis)
        if: ${{ github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.scm.revision=${{ github.event.workflow_run.head_sha }} \
            -Dsonar.branch.name=main
