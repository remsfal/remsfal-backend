name: "Synchronize OpenAPI Spec"

on:
  workflow_run:
    workflows: ["CD Build"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

env:
  BRANCH_PREFIX: 'remsfal-bot/openapi-sync/'

# A release pushes two commits at once; the second run must see the PR branch of the first one
concurrency:
  group: openapi-sync
  cancel-in-progress: false

jobs:
  build-and-sync-openapi:
    name: "Generate OpenAPI and Synchronize with the Frontend"
    runs-on: ubuntu-latest
    # Only run this workflow for the official REMSFAL repository
    if: github.repository == 'remsfal/remsfal-backend' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The commit built by the CD Build, not the current head of main
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Build REMSFAL
        uses: ./.github/actions/build-remsfal
        with:
          skip-tests: 'true'
          skip-checkstyle: 'true'

      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.REMSFAL_BOT_ID }}
          private-key: ${{ secrets.REMSFAL_BOT_KEY }}
          owner: remsfal
          repositories: remsfal-backend,remsfal-frontend
      - name: Identify merged PR
        id: backend-merge
        uses: remsfal/.github/.github/actions/find-merged-pr@main
        with:
          token: ${{ steps.generate-token.outputs.token }}
          sha: ${{ github.event.workflow_run.head_sha }}
      - name: Describe origin of the changes
        id: origin
        env:
          MERGED_PR_NUMBER: ${{ steps.backend-merge.outputs.pr-number }}
          MERGED_PR_TITLE: ${{ steps.backend-merge.outputs.pr-title }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Commits pushed directly to main (e.g. by the maven-release-plugin) have no merged PR
          if [ -n "$MERGED_PR_NUMBER" ]; then
            echo "branch-suffix=${MERGED_PR_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "title=Sync of OpenAPI Spec created by #${MERGED_PR_NUMBER}: ${MERGED_PR_TITLE}" >> "$GITHUB_OUTPUT"
            echo "reference=remsfal/remsfal-backend#${MERGED_PR_NUMBER}: ${MERGED_PR_TITLE}" >> "$GITHUB_OUTPUT"
          else
            SUBJECT=$(git log -1 --format=%s "$SHA")
            echo "branch-suffix=${SHA:0:7}" >> "$GITHUB_OUTPUT"
            echo "title=Sync of OpenAPI Spec for ${SUBJECT}" >> "$GITHUB_OUTPUT"
            echo "reference=remsfal/remsfal-backend@${SHA}: ${SUBJECT}" >> "$GITHUB_OUTPUT"
          fi
      - name: Select existing PR on target
        id: frontend-selection
        uses: remsfal/.github/.github/actions/select-branch@main
        with:
          token: ${{ steps.generate-token.outputs.token }}
          repository: remsfal/remsfal-frontend
          branch-prefix: ${{ env.BRANCH_PREFIX }}

      - name: Checkout Frontend at existing PR branch
        if: steps.frontend-selection.outputs.pr-branch != ''
        uses: actions/checkout@v7
        with:
          repository: remsfal/remsfal-frontend
          ref: ${{ steps.frontend-selection.outputs.pr-branch }}
          token: ${{ steps.generate-token.outputs.token }}
          path: remsfal-frontend
      - name: Checkout Frontend at main branch
        if: steps.frontend-selection.outputs.pr-branch == ''
        uses: actions/checkout@v7
        with:
          repository: remsfal/remsfal-frontend
          ref: main
          token: ${{ steps.generate-token.outputs.token }}
          path: remsfal-frontend
          fetch-depth: 0
      - name: Create new PR branch
        if: steps.frontend-selection.outputs.pr-branch == ''
        env:
          NEW_BRANCH: ${{ env.BRANCH_PREFIX }}${{ steps.origin.outputs.branch-suffix }}
        run: |
          cd remsfal-frontend
          git checkout -b "$NEW_BRANCH"
          echo "Created branch '$NEW_BRANCH'"

      - name: Copy OpenAPI Specs
        run: |
          cd $GITHUB_WORKSPACE/remsfal-frontend
          mkdir -p openapi
          cp -rf $GITHUB_WORKSPACE/target/openapi/* openapi/
          if ! git diff --quiet || [[ -n $(git ls-files --others --exclude-standard) ]]; then
            echo "SPEC_CHANGED=true" >> $GITHUB_ENV
          else
            echo "No Changes made to the data model."
            echo "SPEC_CHANGED=false" >> $GITHUB_ENV
          fi
      - name: Build Frontend Client
        if: ${{ env.SPEC_CHANGED == 'true' }}
        uses: ./.github/actions/build-frontend
        with:
          working-directory: ${{ github.workspace }}/remsfal-frontend
      - name: Configure Git in Frontend Repo
        working-directory: ${{ github.workspace }}/remsfal-frontend
        run: |
          git config user.name  "REMSFAL Bot"
          git config user.email "github.bot@remsfal.de"
      - name: Commit Frontend Changes
        if: ${{ env.SPEC_CHANGED == 'true' }}
        working-directory: ${{ github.workspace }}/remsfal-frontend
        env:
          REFERENCE: ${{ steps.origin.outputs.reference }}
        run: |
          git add --all
          git commit -m "Updated generated files from ${REFERENCE}"

      - name: Push Commits to existing PR branch
        if: ${{ env.SPEC_CHANGED == 'true' && steps.frontend-selection.outputs.pr-branch != '' }}
        working-directory: ${{ github.workspace }}/remsfal-frontend
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          TARGET_BRANCH: ${{ steps.frontend-selection.outputs.pr-branch }}
        run: |
          git push origin "$TARGET_BRANCH"
      - name: Push Commits and create new Pull Request
        if: ${{ env.SPEC_CHANGED == 'true' && steps.frontend-selection.outputs.pr-branch == '' }}
        working-directory: ${{ github.workspace }}/remsfal-frontend
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          BRANCH_NAME: ${{ env.BRANCH_PREFIX }}${{ steps.origin.outputs.branch-suffix }}
          PR_TITLE: ${{ steps.origin.outputs.title }}
          REFERENCE: ${{ steps.origin.outputs.reference }}
        run: |
          PR_BODY="This PR carries the new OpenAPI Spec from remsfal-backend, which was created by ${REFERENCE}"

          git push origin "$BRANCH_NAME"
          echo "Branch $BRANCH_NAME is pushed"
          gh api repos/remsfal/remsfal-frontend/pulls \
            -f base="main" \
            -f head="$BRANCH_NAME" \
            -f title="$PR_TITLE" \
            -f body="$PR_BODY" \
            -f labels="openapi,javascript"
